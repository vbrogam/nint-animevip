<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NINT ANIME - Official</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Exo+2:wght@300;400;600;700;900&family=Noto+Sans+Khmer:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #FFD700;
    --gold-light: #FFF0A0;
    --gold-dark: #B8860B;
    --purple: #7B2FBE;
    --purple-light: #A855F7;
    --purple-dark: #3B0764;
    --cyan: #00D4FF;
    --red: #FF3333;
    --bg: #050508;
    --bg2: #0A0A14;
    --bg3: #0F0F1E;
    --text: #E8E8F0;
    --text-dim: #8888AA;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Exo 2', 'Noto Sans Khmer', sans-serif;
    overflow-x: hidden;
  }
  #particles-canvas {
    position: fixed; top:0; left:0; width:100%; height:100%;
    pointer-events: none; z-index: 0; opacity: 0.4;
  }
  nav {
    position: fixed; top:0; left:0; right:0; z-index:1000;
    display:flex; align-items:center; justify-content:space-between;
    padding: 12px 24px;
    background: linear-gradient(180deg, rgba(5,5,8,0.95) 0%, transparent 100%);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,215,0,0.15);
    transition: background 0.3s;
  }
  .nav-logo {
    display:flex; align-items:center; gap:10px;
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(15px, 3vw, 20px);
    font-weight: 900;
    background: linear-gradient(135deg, var(--gold), var(--gold-light), var(--gold-dark));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    letter-spacing: 2px;
  }
  .nav-logo .dragon-icon {
    width: 42px; height: 42px;
    background: radial-gradient(circle, var(--gold) 0%, var(--gold-dark) 60%);
    border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    font-size:20px;
    box-shadow: 0 0 20px rgba(255,215,0,0.5);
    animation: pulse-gold 2s ease-in-out infinite;
    flex-shrink:0;
  }
  @keyframes pulse-gold {
    0%,100% { box-shadow: 0 0 20px rgba(255,215,0,0.5); }
    50% { box-shadow: 0 0 40px rgba(255,215,0,0.9), 0 0 60px rgba(255,215,0,0.4); }
  }
  .nav-links { display:flex; gap:20px; list-style:none; }
  .nav-links a {
    color: var(--text-dim); text-decoration:none;
    font-size: 12px; font-weight:600; letter-spacing:1px;
    text-transform: uppercase; transition: color 0.3s;
  }
  .nav-links a:hover { color: var(--gold); }
  .nav-vip-btn {
    background: linear-gradient(135deg, var(--purple), var(--purple-light));
    color: #fff !important; padding: 8px 16px; border-radius: 20px;
    font-weight:700 !important;
    box-shadow: 0 0 20px rgba(168,85,247,0.4);
    transition: all 0.3s !important;
  }
  .nav-vip-btn:hover { box-shadow: 0 0 30px rgba(168,85,247,0.7) !important; color:#fff !important; }

  /* HERO */
  .hero {
    position: relative; z-index:1;
    min-height: 100vh;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center; padding: 120px 20px 80px; overflow: hidden;
  }
  .hero-bg {
    position:absolute; inset:0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 40%, rgba(123,47,190,0.25) 0%, transparent 70%),
      radial-gradient(ellipse 60% 40% at 80% 20%, rgba(255,215,0,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 20% 80%, rgba(0,212,255,0.08) 0%, transparent 60%),
      linear-gradient(180deg, #050508 0%, #0A0A1A 50%, #050508 100%);
  }
  .dragon-circle {
    width: 110px; height: 110px; border-radius:50%;
    background: linear-gradient(135deg, var(--gold-dark), var(--gold), var(--gold-light));
    display:flex; align-items:center; justify-content:center; font-size: 50px;
    margin: 0 auto 24px;
    box-shadow: 0 0 40px rgba(255,215,0,0.6), 0 0 80px rgba(255,215,0,0.3);
    animation: dragon-spin 4s ease-in-out infinite, pulse-gold 2s ease-in-out infinite;
    position:relative; z-index:2;
  }
  @keyframes dragon-spin {
    0%,100% { transform: scale(1) rotate(0deg); }
    25% { transform: scale(1.05) rotate(3deg); }
    75% { transform: scale(1.05) rotate(-3deg); }
  }
  .hero-subtitle {
    font-size: clamp(10px, 2vw, 12px); letter-spacing: 8px;
    color: var(--gold); text-transform: uppercase; margin-bottom: 14px;
    font-weight: 600; position:relative; z-index:2;
    animation: fadeInUp 0.8s ease both;
  }
  .hero-title {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(40px, 12vw, 96px); font-weight: 900;
    line-height: 1; margin-bottom: 12px;
    position:relative; z-index:2;
    animation: fadeInUp 0.8s 0.1s ease both;
  }
  .hero-title .nint {
    display:block;
    background: linear-gradient(135deg, var(--gold-dark) 0%, var(--gold) 40%, var(--gold-light) 60%, var(--gold) 80%, var(--gold-dark) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 30px rgba(255,215,0,0.5));
  }
  .hero-title .nime {
    display:block; font-size: 0.52em;
    background: linear-gradient(135deg, var(--purple-light), var(--cyan));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 20px rgba(168,85,247,0.5));
    letter-spacing: 18px;
  }
  .hero-tagline {
    font-family: 'Noto Sans Khmer', sans-serif;
    font-size: clamp(12px, 3vw, 17px); color: var(--text-dim);
    margin-bottom: 36px; font-weight: 300; letter-spacing: 2px;
    position:relative; z-index:2; animation: fadeInUp 0.8s 0.2s ease both;
  }
  .hero-btns {
    display:flex; gap:14px; flex-wrap:wrap; justify-content:center;
    position:relative; z-index:2; animation: fadeInUp 0.8s 0.3s ease both;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--gold-dark), var(--gold));
    color: #000; padding: 13px 32px; border-radius: 40px;
    font-weight: 800; font-size: 13px; letter-spacing: 2px; text-transform: uppercase;
    text-decoration: none; box-shadow: 0 0 30px rgba(255,215,0,0.4);
    transition: all 0.3s; display:inline-flex; align-items:center; gap:8px;
    border: none; cursor:pointer;
  }
  .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 0 50px rgba(255,215,0,0.7); }
  .btn-secondary {
    background: transparent; color: var(--purple-light);
    padding: 13px 32px; border-radius: 40px;
    font-weight: 700; font-size: 13px; letter-spacing: 2px; text-transform: uppercase;
    text-decoration: none; border: 2px solid var(--purple-light);
    box-shadow: 0 0 20px rgba(168,85,247,0.2); transition: all 0.3s;
    display:inline-flex; align-items:center; gap:8px;
  }
  .btn-secondary:hover { background: rgba(168,85,247,0.15); transform: translateY(-3px); box-shadow: 0 0 40px rgba(168,85,247,0.5); }
  .scroll-indicator {
    position:absolute; bottom:28px; left:50%; transform: translateX(-50%);
    z-index:2; animation: bounce 2s ease-in-out infinite;
  }
  .scroll-indicator span {
    display:block; width:22px; height:34px;
    border: 2px solid rgba(255,215,0,0.4); border-radius: 12px; position:relative;
  }
  .scroll-indicator span::after {
    content:''; position:absolute; top:5px; left:50%; transform: translateX(-50%);
    width:4px; height:7px; background: var(--gold); border-radius: 2px;
    animation: scroll-dot 2s ease-in-out infinite;
  }
  @keyframes bounce { 0%,100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(8px); } }
  @keyframes scroll-dot { 0% { top:5px; opacity:1; } 100% { top:17px; opacity:0; } }

  /* STATS */
  .stats-bar {
    position:relative; z-index:1;
    display:flex; justify-content:center;
    padding: 18px; flex-wrap:wrap;
    border-top: 1px solid rgba(255,215,0,0.1);
    border-bottom: 1px solid rgba(255,215,0,0.1);
    background: rgba(255,215,0,0.03);
  }
  .stat-item { padding: 14px 28px; text-align:center; border-right: 1px solid rgba(255,215,0,0.1); }
  .stat-item:last-child { border-right:none; }
  .stat-num {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(20px, 4vw, 30px); font-weight: 900;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .stat-label { font-size: 10px; letter-spacing: 2px; color: var(--text-dim); text-transform: uppercase; font-family: 'Noto Sans Khmer', sans-serif; }

  /* SECTION */
  section { position:relative; z-index:1; padding: 72px 20px; }
  .section-header { text-align:center; margin-bottom: 48px; }
  .section-label { font-size: 11px; letter-spacing: 6px; color: var(--gold); text-transform: uppercase; margin-bottom: 12px; display:block; font-weight: 600; }
  .section-title {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(22px, 5vw, 38px); font-weight: 900;
    background: linear-gradient(135deg, var(--text) 0%, var(--text-dim) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 12px;
  }
  .section-line { width: 80px; height: 3px; background: linear-gradient(90deg, transparent, var(--gold), transparent); margin: 14px auto 0; border-radius: 2px; }

  /* SCHEDULE */
  .schedule-bg { background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 50%, var(--bg) 100%); }
  .schedule-row-label { display:flex; align-items:center; gap:14px; margin-bottom: 18px; margin-top: 36px; }
  .row-num {
    width: 46px; height: 46px; border-radius: 50%;
    background: linear-gradient(135deg, var(--gold-dark), var(--gold));
    display:flex; align-items:center; justify-content:center;
    font-family: 'Cinzel Decorative', serif; font-size: 17px; font-weight: 900; color: #000;
    box-shadow: 0 0 20px rgba(255,215,0,0.4); flex-shrink:0;
  }
  .row-title-text { font-size: 13px; letter-spacing: 3px; color: var(--gold); text-transform: uppercase; font-weight: 600; }
  .row-divider { flex:1; height:1px; background: linear-gradient(90deg, rgba(255,215,0,0.4), transparent); }

  /* ANIME GRID */
  .anime-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 14px; max-width: 1200px; margin: 0 auto;
  }
  .anime-card {
    background: var(--bg3); border-radius: 12px; overflow: hidden;
    border: 1px solid rgba(255,215,0,0.08); transition: all 0.3s ease;
    cursor:pointer; position:relative;
  }
  .anime-card:hover {
    border-color: rgba(255,215,0,0.5); transform: translateY(-6px) scale(1.02);
    box-shadow: 0 16px 40px rgba(0,0,0,0.6), 0 0 24px rgba(255,215,0,0.2);
  }
  .anime-card-img {
    width:100%; aspect-ratio: 3/4; position:relative; overflow:hidden;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
  }
  .anime-card-img img {
    width:100%; height:100%; object-fit:cover;
    transition: transform 0.4s ease;
    display:block;
  }
  .anime-card:hover .anime-card-img img { transform: scale(1.1); }
  .anime-img-fallback {
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-size: 38px;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
  }
  .anime-card-overlay {
    position:absolute; inset:0;
    background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.85) 100%);
    opacity:0; transition: opacity 0.3s;
    display:flex; align-items:center; justify-content:center;
  }
  .anime-card:hover .anime-card-overlay { opacity:1; }
  .play-btn-overlay {
    background: rgba(255,215,0,0.92); color: #000; border-radius:50%;
    width: 44px; height:44px; display:flex; align-items:center; justify-content:center;
    font-size: 18px; box-shadow: 0 0 20px rgba(255,215,0,0.6);
  }
  .anime-card-info { padding: 9px 9px 11px; }
  .anime-card-title {
    font-size: 10.5px; font-weight: 700; color: var(--text); line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .anime-card-new {
    position:absolute; top:7px; right:7px;
    background: linear-gradient(135deg, var(--red), #FF6666);
    color: #fff; font-size: 8px; font-weight: 800;
    padding: 3px 6px; border-radius: 4px; letter-spacing: 1px; text-transform:uppercase;
  }
  .anime-card-ep {
    position:absolute; bottom:48px; left:7px;
    background: rgba(0,0,0,0.75); backdrop-filter:blur(4px);
    color: var(--gold-light); font-size: 8px; font-weight: 700;
    padding: 2px 6px; border-radius: 4px;
  }

  /* VIP */
  .vip-section { background: linear-gradient(180deg, var(--bg2) 0%, var(--purple-dark) 50%, var(--bg2) 100%); }
  .vip-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 22px; max-width: 940px; margin: 0 auto; }
  .vip-card {
    border-radius: 20px; padding: 34px 26px; text-align:center;
    transition: all 0.3s ease; position:relative; overflow:hidden; cursor:default;
  }
  .vip-card::before {
    content:''; position:absolute; inset:0; border-radius:20px; padding:2px;
    background: linear-gradient(135deg, var(--c1), var(--c2));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
  }
  .vip-card.standard { background: linear-gradient(160deg, #0D1B2A, #162032); --c1: #4488BB; --c2: #1166AA; }
  .vip-card.gold { background: linear-gradient(160deg, #1A1400, #261C00); --c1: var(--gold); --c2: var(--gold-dark); transform: scale(1.04); box-shadow: 0 0 60px rgba(255,215,0,0.25); }
  .vip-card.platinum { background: linear-gradient(160deg, #120825, #1E0A3C); --c1: var(--purple-light); --c2: var(--cyan); }
  .vip-card:hover { transform: scale(1.06) !important; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
  .vip-badge { font-size: 50px; margin-bottom: 14px; filter: drop-shadow(0 0 10px rgba(255,215,0,0.4)); }
  .vip-tier {
    font-family: 'Cinzel Decorative', serif; font-size: 21px; font-weight: 900; margin-bottom: 4px;
    background: linear-gradient(135deg, var(--c1), var(--c2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .vip-subtitle-km { font-family: 'Noto Sans Khmer', sans-serif; font-size: 12px; color: var(--text-dim); margin-bottom: 22px; }
  .vip-price {
    font-family: 'Cinzel Decorative', serif; font-size: 42px; font-weight: 900; margin-bottom: 4px;
    background: linear-gradient(135deg, var(--c1), var(--c2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 10px rgba(255,215,0,0.2));
  }
  .vip-period { font-size: 12px; color: var(--text-dim); font-family: 'Noto Sans Khmer', sans-serif; margin-bottom: 26px; }
  .vip-features { list-style:none; text-align:left; margin-bottom: 28px; }
  .vip-features li {
    display:flex; align-items:flex-start; gap:9px; padding: 7px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    font-size: 12px; color: var(--text-dim); line-height:1.5;
    font-family: 'Noto Sans Khmer', sans-serif;
  }
  .vip-features li:last-child { border-bottom:none; }
  .feat-icon { flex-shrink:0; font-size:14px; }
  .vip-subscribe {
    display:block; width:100%; padding: 13px; border-radius: 40px;
    font-weight: 800; font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
    text-decoration: none; border:none; cursor:pointer; font-family: 'Exo 2', sans-serif; transition: all 0.3s;
  }
  .vip-card.standard .vip-subscribe { background: linear-gradient(135deg, #1166AA, #4488BB); color:#fff; box-shadow: 0 0 20px rgba(68,136,187,0.3); }
  .vip-card.gold .vip-subscribe { background: linear-gradient(135deg, var(--gold-dark), var(--gold)); color:#000; box-shadow: 0 0 30px rgba(255,215,0,0.4); }
  .vip-card.platinum .vip-subscribe { background: linear-gradient(135deg, var(--purple), var(--purple-light)); color:#fff; box-shadow: 0 0 25px rgba(168,85,247,0.4); }
  .vip-subscribe:hover { transform: translateY(-2px); filter: brightness(1.2); }
  .vip-popular-tag {
    position:absolute; top:14px; right:14px;
    background: linear-gradient(135deg, var(--gold-dark), var(--gold));
    color: #000; font-size: 9px; font-weight: 800; padding: 3px 9px; border-radius: 20px; letter-spacing: 1px;
  }

  /* PROMO */
  .promo-section { background: var(--bg); }
  .promo-card {
    max-width: 700px; margin: 0 auto;
    background: linear-gradient(135deg, rgba(123,47,190,0.15), rgba(168,85,247,0.08));
    border: 1px solid rgba(168,85,247,0.3); border-radius: 24px; padding: 46px 38px; text-align:center;
    position:relative; overflow:hidden; box-shadow: 0 0 60px rgba(123,47,190,0.2);
  }
  .promo-card::before {
    content:''; position:absolute; top:-50%; left:-50%; width:200%; height:200%;
    background: conic-gradient(from 0deg, transparent 0%, rgba(168,85,247,0.05) 30%, transparent 60%);
    animation: rotate-bg 8s linear infinite;
  }
  @keyframes rotate-bg { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  .promo-title { font-family: 'Cinzel Decorative', serif; font-size: clamp(20px, 5vw, 32px); font-weight: 900; color: var(--gold); margin-bottom: 8px; position:relative; z-index:1; text-shadow: 0 0 30px rgba(255,215,0,0.4); }
  .promo-period { font-size: 13px; color: var(--text-dim); margin-bottom: 30px; position:relative; z-index:1; font-family: 'Noto Sans Khmer', sans-serif; }
  .promo-items { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; position:relative; z-index:1; margin-bottom: 30px; text-align:left; }
  .promo-item {
    background: rgba(0,0,0,0.3); border-radius: 12px; padding: 14px;
    display:flex; align-items:center; gap:10px;
    border: 1px solid rgba(255,215,0,0.1); transition: border-color 0.3s;
  }
  .promo-item:hover { border-color: rgba(255,215,0,0.3); }
  .promo-item-icon { font-size: 22px; flex-shrink:0; }
  .promo-item-text { font-size: 11px; color: var(--text-dim); font-family: 'Noto Sans Khmer', sans-serif; line-height:1.5; }
  .promo-item-text strong { color: var(--gold); display:block; font-size: 14px; }

  /* TELEGRAM */
  .telegram-section { background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%); text-align:center; }
  .tg-card {
    max-width: 380px; margin: 0 auto;
    background: linear-gradient(160deg, #0F2027, #203A43, #2C5364);
    border-radius: 24px; padding: 38px 30px;
    border: 1px solid rgba(0,212,255,0.2); box-shadow: 0 0 60px rgba(0,212,255,0.1);
  }
  .tg-logo { font-size: 60px; margin-bottom: 14px; }
  .tg-handle { font-family: 'Cinzel Decorative', serif; font-size: 22px; font-weight: 900; color: var(--cyan); margin-bottom: 8px; text-shadow: 0 0 20px rgba(0,212,255,0.5); letter-spacing:2px; }
  .tg-desc { font-size: 12px; color: var(--text-dim); font-family: 'Noto Sans Khmer', sans-serif; margin-bottom: 26px; line-height:1.8; }
  .tg-btn {
    display:inline-flex; align-items:center; gap:9px;
    background: linear-gradient(135deg, #229ED9, #1A7DB0); color:#fff;
    padding: 13px 30px; border-radius: 40px; font-weight: 800; font-size: 13px;
    letter-spacing: 1px; text-decoration:none; box-shadow: 0 0 30px rgba(34,158,217,0.4); transition: all 0.3s;
  }
  .tg-btn:hover { transform: translateY(-3px); box-shadow: 0 0 50px rgba(34,158,217,0.6); }

  footer {
    position:relative; z-index:1; background: var(--bg);
    border-top: 1px solid rgba(255,215,0,0.1); padding: 36px 20px; text-align:center;
  }
  .footer-logo { font-family: 'Cinzel Decorative', serif; font-size: 26px; font-weight: 900; background: linear-gradient(135deg, var(--gold-dark), var(--gold), var(--gold-light)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
  .footer-text { font-size: 11px; color: var(--text-dim); font-family: 'Noto Sans Khmer', sans-serif; line-height:1.8; }
  @keyframes fadeInUp { from { opacity:0; transform: translateY(30px); } to { opacity:1; transform: translateY(0); } }
  .fade-in { opacity:0; transform: translateY(30px); transition: opacity 0.7s ease, transform 0.7s ease; }
  .fade-in.visible { opacity
